name: Release APK

# 打 tag（如 v1.12）时自动构建 Release APK 并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # 也允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/petan_${{ steps.ver.outputs.version }}.apk"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/petan_*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
